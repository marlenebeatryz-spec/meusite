<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlene Beatryz</title>
<style>
  :root {
    --bg: #eef5fc;
    --texto: #12263f;
    --texto-suave: #4a6380;
    --destaque: #1f6fb5;
    --linha: #cfe0f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px;
    background: var(--bg);
    color: var(--texto);
    font-family: Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 {
    margin: 0 0 8px;
    color: var(--destaque);
    font-size: 2.4rem;
    text-transform: uppercase;
  }
  .subtitulo {
    margin: 0 0 24px;
    padding-bottom: 24px;
    color: var(--texto-suave);
    font-size: 1.2rem;
    border-bottom: 3px solid var(--destaque);
  }
  h2 { margin: 32px 0 16px; font-size: 1.6rem; }
  ul { padding-left: 22px; font-size: 1.15rem; }
  li { margin-bottom: 12px; }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--linha);
    color: var(--texto-suave);
    font-size: 1rem;
  }
</style>
</head>
<body>
<main>
  <h1>Marlene Beatryz</h1>
  <p class="subtitulo">1º ano · Técnico em Desenvolvimento Web · IFMA</p>

  <h2>Três coisas sobre mim</h2>
  <ul>
    <li>Gosto de dormir</li>
    <li>Gosto de costura</li>
    <li>Gosto de escrever histórias</li>
  </ul>

  <footer>Feito na aula de Redes de Computadores · Semana 7 · Cliente-servidor e portas</footer>
</main>
</body>
</html>
